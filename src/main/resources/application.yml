spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/cloud_storage
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

liquibase:
  enabled: true
  change-log: classpath:/db/changelog/db.changelog-master.yaml

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: password
  bucket: user-files